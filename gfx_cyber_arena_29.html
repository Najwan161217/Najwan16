<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GFX Glitch eror | Halaman 4</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070515;color:#fff;font-family:ui-monospace,Consolas,monospace}
#scene{height:min(84vh,760px);min-height:400px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#35165f,#11113b 45%,#070817 85%)}
#threeHost{position:absolute;inset:0}
#threeHost canvas{display:block;width:100%;height:100%}
.error-glitch-overlay{position:absolute;inset:0;z-index:4;width:100%;height:100%;pointer-events:none;opacity:0}
.hud{position:absolute;inset:0;pointer-events:none}
.back-button{position:absolute;top:12px;right:14px;z-index:10;width:36px;height:36px;border:1px solid #2587ad;border-radius:50%;background:#09091bcc;color:#73eaff;font:20px ui-monospace,Consolas,monospace;cursor:pointer}
.back-button:hover{border-color:#a855f7;color:#e9d5ff}
.gallery-button{position:absolute;top:12px;right:60px;z-index:10;padding:10px 13px;border:1px solid #8056bf;border-radius:18px;background:#09091bcc;color:#e7dcff;font:10px ui-monospace,Consolas,monospace;letter-spacing:1px;cursor:pointer}
.gallery-button:hover{border-color:#40dcff;color:#8aeaff}
#popLayer{position:absolute;inset:0;z-index:5;overflow:hidden;pointer-events:none}
.xpwindow{position:absolute;width:clamp(165px,23%,225px);background:#d6d6d2;color:#111;border:2px solid #1854a4;border-radius:3px;box-shadow:2px 3px 10px #0009,0 0 10px #448cff66;pointer-events:auto;animation:appear .3s ease-out both}
.xpbar{height:21px;background:linear-gradient(180deg,#3e9bf8,#0752b6 55%,#17458c);color:white;font:bold 10px Arial,sans-serif;padding:4px 5px;display:flex;justify-content:space-between;align-items:center;text-shadow:1px 1px #173b70}
.xpclose{background:linear-gradient(#ff9d8d,#e52a24);border:1px solid white;color:white;width:15px;height:15px;line-height:12px;text-align:center;border-radius:2px;font:bold 12px Arial;cursor:pointer}
.xpbody{padding:12px 9px 7px;display:flex;gap:9px;align-items:center;font:11px Arial,sans-serif;min-height:52px}
.warning{font-size:25px;color:#e8b400}
.xpfoot{padding:3px 8px 8px;text-align:right}
.xpok{font:10px Arial,sans-serif;color:#111;background:linear-gradient(#fff,#d5d5d5);border:1px solid #42658a;border-radius:2px;padding:3px 13px;cursor:pointer}
.xpwindow.leaving{animation:fade .65s ease-in forwards}
@keyframes appear{from{opacity:0;transform:translateY(10px) scale(.88)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fade{to{opacity:0;transform:translateY(-9px) scale(.94)}}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#d7b8ff0a 4px)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:13px;background:#0c0920;border-top:1px solid #49316f}
button.control{font:10px ui-monospace,monospace;border:1px solid #8056bf;background:#17102f;color:#e7dcff;border-radius:5px;padding:9px 12px;cursor:pointer}
button.control.active{background:#10405a;border-color:#40dcff;color:#8aeaff}
.speed{margin-left:auto;display:flex;gap:7px;align-items:center;font-size:10px;background:#09091dcc;border:1px solid #6345a7;border-radius:5px;padding:7px}
input{width:90px;accent-color:#35dfff}
.gallery-overlay,.lightbox-overlay{position:fixed;inset:0;z-index:40;display:none;background:rgba(5,2,14,.96);backdrop-filter:blur(12px);overflow-y:auto;padding:22px}
.gallery-overlay.open{display:block}
.gallery-overlay.glitch-active::after,.lightbox-overlay.glitch-active::after{
 content:"";position:fixed;inset:0;z-index:80;pointer-events:none;
 mix-blend-mode:screen;
}
.gallery-overlay.variant-rgb::after,.lightbox-overlay.variant-rgb::after{
 background:
  repeating-linear-gradient(0deg,transparent 0 5px,rgba(194,83,255,.28) 6px 8px),
  repeating-linear-gradient(90deg,rgba(255,40,200,.36) 0 4px,transparent 4px 17px,rgba(40,225,255,.34) 17px 21px,transparent 21px 29px);
 box-shadow:inset 28px 0 rgba(255,52,186,.24),inset -28px 0 rgba(54,224,255,.24);
 animation:galleryRgbSplit .34s steps(5,end) both;
}
.gallery-overlay.variant-block::after,.lightbox-overlay.variant-block::after{
 background:
  linear-gradient(90deg,transparent 0 6%,rgba(56,221,255,.96) 6% 30%,rgba(255,255,255,.42) 30% 32%,transparent 32% 50%,rgba(255,70,205,.92) 50% 70%,rgba(255,255,255,.34) 70% 72%,transparent 72%),
  repeating-linear-gradient(0deg,transparent 0 8px,rgba(255,255,255,.42) 9px 11px);
 animation:galleryBlockTear .38s steps(4,end) both;
}
.gallery-overlay.variant-scan::after,.lightbox-overlay.variant-scan::after{
 background:
  repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0 2px,transparent 2px 5px),
  linear-gradient(90deg,rgba(75,238,255,.88),transparent 18%,transparent 78%,rgba(214,70,239,.82));
 box-shadow:inset 0 2px rgba(255,255,255,.3),inset 0 -2px rgba(214,70,239,.28);
 animation:galleryScanTear .46s steps(7,end) both;
}
@keyframes galleryRgbSplit{
 0%{clip-path:inset(7% 0 84% 0);transform:translateX(-5px) skewX(-2deg);opacity:.95}
 18%{clip-path:inset(31% 0 58% 0);transform:translateX(10px) skewX(1deg);opacity:.85}
 36%{clip-path:inset(67% 0 20% 0);transform:translateX(-11px) skewX(-1deg);opacity:.9}
 54%{clip-path:inset(46% 0 43% 0);transform:translateX(6px);opacity:.7}
 72%{clip-path:inset(82% 0 6% 0);transform:translateX(-4px);opacity:.8}
 100%{clip-path:inset(100% 0 0 0);transform:translateX(0);opacity:0}
}
@keyframes galleryBlockTear{
 0%{clip-path:inset(4% 0 82% 0);opacity:.9;transform:translateX(-12px)}
 20%{clip-path:inset(22% 0 54% 0);opacity:.75;transform:translateX(16px)}
 40%{clip-path:inset(55% 0 24% 0);opacity:.95;transform:translateX(-8px)}
 60%{clip-path:inset(72% 0 9% 0);opacity:.65;transform:translateX(11px)}
 80%{clip-path:inset(38% 0 48% 0);opacity:.82;transform:translateX(-3px)}
 100%{clip-path:inset(100% 0 0 0);opacity:0;transform:translateX(0)}
}
@keyframes galleryScanTear{
 0%{clip-path:inset(12% 0 76% 0);opacity:.8;transform:scaleY(.7)}
 16%{clip-path:inset(34% 0 44% 0);opacity:.95;transform:scaleY(1)}
 32%{clip-path:inset(68% 0 21% 0);opacity:.65;transform:scaleY(.85)}
 48%{clip-path:inset(48% 0 36% 0);opacity:.9;transform:scaleY(1.15)}
 64%{clip-path:inset(82% 0 8% 0);opacity:.55;transform:scaleY(.75)}
 82%{clip-path:inset(21% 0 69% 0);opacity:.72;transform:scaleY(1)}
 100%{clip-path:inset(100% 0 0 0);opacity:0;transform:scaleY(1)}
}
.gallery-overlay.glitch-active .gallery-panel,
.lightbox-overlay.glitch-active figure{
 will-change:transform,filter;
 animation:galleryJitter .09s steps(3,end) infinite;
}
@keyframes galleryJitter{
 0%{transform:translate(0,0) skewX(0);filter:none}
 20%{transform:translate(-3px,.8px) skewX(-.35deg);filter:contrast(1.08) saturate(1.12)}
 40%{transform:translate(3px,-.6px) skewX(.35deg);filter:hue-rotate(3deg) contrast(1.12)}
 60%{transform:translate(-1.5px,-1px) skewX(.15deg);filter:contrast(1.06)}
 80%{transform:translate(2px,.8px) skewX(-.2deg);filter:saturate(1.1)}
 100%{transform:translate(0,0) skewX(0);filter:none}
}
.gallery-panel{width:min(1180px,100%);margin:0 auto}
.gallery-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 0 18px;border-bottom:1px solid #8056bf66}
.gallery-header h2{margin:0;color:#fff;font-size:clamp(18px,3vw,26px);letter-spacing:2px}
.gallery-header p{margin:6px 0 0;color:#b9a7e9;font:11px ui-monospace,Consolas,monospace}
.gallery-close,.lightbox-close,.lightbox-nav{display:grid;place-items:center;border:1px solid #8056bf99;background:#17102fcc;color:#fff;cursor:pointer}
.gallery-close{width:40px;height:40px;border-radius:50%;font-size:23px}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px;padding:18px 0}
.gallery-card{overflow:hidden;padding:0;border:1px solid #8056bf77;border-radius:10px;background:#090713;color:#fff;text-align:left;cursor:pointer;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.gallery-card:hover{transform:translateY(-3px);border-color:#40dcff;box-shadow:0 0 22px #38ddff33}
.gallery-card img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#05040b}
.gallery-card span{display:block;padding:9px 10px;color:#d9c9ff;font:10px ui-monospace,Consolas,monospace;letter-spacing:.6px}
.lightbox-overlay{z-index:50;align-items:center;justify-content:center;overflow:hidden;background:rgba(4,2,11,.95)}
.lightbox-overlay.open{display:flex}
.lightbox-image{display:block;max-width:min(84vw,1200px);max-height:78vh;object-fit:contain;border:1px solid #d946ef88;border-radius:12px;background:#070515;box-shadow:0 0 40px #9a4cff55}
.lightbox-caption{margin-top:12px;color:#e8d8ff;font:11px ui-monospace,Consolas,monospace;letter-spacing:1px;text-align:center}
.lightbox-close,.lightbox-nav{position:fixed;z-index:2;width:44px;height:44px;border-radius:50%;font-size:22px}
.lightbox-close{top:18px;right:18px}
.lightbox-nav{top:50%;transform:translateY(-50%)}
.lightbox-prev{left:16px}.lightbox-next{right:16px}
.gallery-close:hover,.lightbox-close:hover,.lightbox-nav:hover{border-color:#40dcff;color:#8aeaff}
@media(max-width:520px){#scene{height:72vh;min-height:390px}.back-button{top:8px;right:8px}.gallery-button{top:8px;right:52px;padding:9px 10px}.controls{gap:6px}button.control{padding:8px;font-size:9px}.speed{margin-left:0}.gallery-overlay{padding:14px}.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.lightbox-image{max-width:84vw;max-height:72vh}.lightbox-prev{left:8px}.lightbox-next{right:8px}}
</style>
</head>
<body>
<main id="scene">
 <div id="threeHost"></div>
 <canvas class="error-glitch-overlay" id="errorGlitchOverlay" aria-hidden="true"></canvas>
 <div id="popLayer"></div>
 <button class="gallery-button" id="openGallery" type="button" aria-label="Buka galeri foto">GALLERY</button>
 <button class="back-button" id="backToWaifu" type="button" aria-label="Kembali ke halaman 3" title="Kembali ke halaman 3">←</button>
 <div class="hud"><div class="scan"></div></div>
</main>
<div class="controls">
 <button class="control active" id="pause">Ⅱ PAUSE</button>
 <button class="control active" id="errors">ERRORS ON</button>
 <label class="speed">SPEED <input id="speed" type="range" min=".2" max="3" step=".1" value="1"><span id="speedVal">1.0x</span></label>
</div>
<div class="gallery-overlay" id="galleryOverlay" aria-hidden="true">
 <section class="gallery-panel" role="dialog" aria-modal="true" aria-labelledby="galleryTitle">
  <div class="gallery-header">
   <div><h2 id="galleryTitle">GFX GALLERY</h2><p>Pilih foto untuk melihat ukuran penuh</p></div>
   <button class="gallery-close" id="closeGallery" type="button" aria-label="Tutup galeri">×</button>
  </div>
  <div class="gallery-grid" id="galleryGrid"></div>
 </section>
</div>
<div class="lightbox-overlay" id="photoLightbox" aria-hidden="true">
 <button class="lightbox-close" id="closePhoto" type="button" aria-label="Tutup foto">×</button>
 <button class="lightbox-nav lightbox-prev" id="previousPhoto" type="button" aria-label="Foto sebelumnya">‹</button>
 <figure>
  <img class="lightbox-image" id="photoView" alt="">
  <figcaption class="lightbox-caption" id="photoCaption"></figcaption>
 </figure>
 <button class="lightbox-nav lightbox-next" id="nextPhoto" type="button" aria-label="Foto berikutnya">›</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const host=document.querySelector('#threeHost'), sceneEl=document.querySelector('#scene');
const glitchOverlay=document.querySelector('#errorGlitchOverlay'),glitchContext=glitchOverlay.getContext('2d');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080619);
scene.fog=new THREE.FogExp2(0x09071c,.012);
const camera=new THREE.PerspectiveCamera(68,1,.1,180);
camera.position.set(0,2.1,9);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.3;
host.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x7770bb,1.3));
const purple=new THREE.PointLight(0xa52cff,48,55);purple.position.set(0,4,-30);scene.add(purple);
const cyan=new THREE.PointLight(0x20dfff,30,45);cyan.position.set(0,3,-68);scene.add(cyan);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(14,150),new THREE.MeshStandardMaterial({color:0x11122f,metalness:.8,roughness:.32,emissive:0x080b27,emissiveIntensity:.8}));
floor.rotation.x=-Math.PI/2;floor.position.set(0,-.04,-68);scene.add(floor);
const grid=new THREE.GridHelper(150,75,0x9a5aff,0x3655a0);grid.position.set(0,.015,-68);scene.add(grid);
const ceiling=new THREE.GridHelper(150,45,0x6335a3,0x25245a);ceiling.position.set(0,9,-68);scene.add(ceiling);

const gfxFiles=Array.from({length:29},(_,index)=>`assets/gfx/gfx-${String(index+1).padStart(2,'0')}.png`);
const gfxTextureLoader=new THREE.TextureLoader();
const gfxTextures=gfxFiles.map(imagePath=>{
 const texture=gfxTextureLoader.load(imagePath,undefined,undefined,error=>console.error(`GFX asli gagal dimuat: ${imagePath}`,error));
 texture.colorSpace=THREE.SRGBColorSpace;
 texture.anisotropy=renderer.capabilities.getMaxAnisotropy();
 return texture;
});
const glitchVertexShader=`
varying vec2 vUv;
void main(){
 vUv=uv;
 gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
}`;
const glitchFragmentShader=`
uniform sampler2D uMap;
uniform float uTime;
uniform float uGlitch;
uniform float uSeed;
varying vec2 vUv;
float hash(float value){return fract(sin(value)*43758.5453);}
void main(){
 vec2 uv=vUv;
 float stripe=floor(uv.y*48.0+uTime*5.0+uSeed);
 float noise=hash(stripe*12.9898+uSeed);
 uv.x+=(noise-0.5)*0.14*step(0.74,noise)*uGlitch;
 vec2 pixelUv=floor(uv*vec2(82.0))/vec2(82.0);
 uv=mix(uv,pixelUv,uGlitch*0.9);
 float split=0.015*uGlitch;
 vec3 color=vec3(
  texture2D(uMap,uv+vec2(split,0.0)).r,
  texture2D(uMap,uv).g,
  texture2D(uMap,uv-vec2(split,0.0)).b
 );
 color=clamp((color-0.5)*1.07+0.52,0.0,1.0);
 float scanline=step(0.5,fract(vUv.y*120.0+uTime*3.0));
 vec2 cell=fract(vUv*vec2(85.0))-0.5;
 float dotPixel=1.0-step(0.19,length(cell));
 color*=1.0-uGlitch*(0.12+0.25*scanline+0.42*dotPixel);
 color*=mix(vec3(1.0),vec3(0.62,0.68,1.05),uGlitch*0.55);
 float tear=step(0.975,fract(vUv.y*15.0+uTime*1.6+uSeed));
 color+=vec3(0.12,0.44,0.78)*tear*uGlitch*0.55;
 gl_FragColor=vec4(color,1.0);
 #include <tonemapping_fragment>
 #include <colorspace_fragment>
}`;
const panels=[],photoMeshes=[],colors=[0x9a4cff,0x38ddff,0xf14bd0];
for(let i=0;i<gfxFiles.length*2;i++){
 const side=i%2===0?-1:1,depth=-7-Math.floor(i/2)*4.2-(i%2)*1.8;
 const size=2.2+(i%4)*.32;
 const group=new THREE.Group();
 group.position.set(side*(2.9+(Math.floor(i/2)%5)*.42),1.8+(i%5)*.62,depth);
 group.rotation.y=side<0?Math.PI/2:-Math.PI/2;
 const texture=gfxTextures[i%gfxTextures.length];
 const glitchMaterial=new THREE.ShaderMaterial({
  uniforms:{
   uMap:{value:texture},
   uTime:{value:0},
   uGlitch:{value:0},
   uSeed:{value:Math.random()*1000}
  },
  vertexShader:glitchVertexShader,
  fragmentShader:glitchFragmentShader,
  side:THREE.DoubleSide
 });
 const photoMesh=new THREE.Mesh(new THREE.PlaneGeometry(size,size),glitchMaterial);
 photoMesh.userData.imageIndex=i%gfxFiles.length;
 group.add(photoMesh);photoMeshes.push(photoMesh);
 const edge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(size+.08,size+.08)),new THREE.LineBasicMaterial({color:colors[i%3]}));
 edge.position.z=.015;group.add(edge);scene.add(group);
 panels.push({
  group,
  base:depth,
  glitchMaterial,
  glitchState:{nextAt:null,start:0,duration:0,strength:0}
 });
}
const deco=[];
for(let i=0;i<120;i++){
 const corner=Math.random()<.72,side=Math.random()<.5?-1:1,upper=Math.random()<.5;
 const x=corner?side*(5.1+Math.random()*1.9):(Math.random()-.5)*12;
 const y=corner?(upper?6.8+Math.random()*1.8:.35+Math.random()*1.5):.5+Math.random()*7.8;
 const geo=i%3===0?new THREE.BoxGeometry(.28,.28,.28):i%3===1?new THREE.OctahedronGeometry(.2):new THREE.TetrahedronGeometry(.22);
 const palette=[0x33dfff,0xc04dff,0x9e88ff,0xf14bd0];
 const mat=new THREE.MeshBasicMaterial({color:palette[i%palette.length],wireframe:i%3!==0});
 const o=new THREE.Mesh(geo,mat);
 o.position.set(x,y,-Math.random()*125);
 o.scale.setScalar(.8+Math.random()*1.4);
 scene.add(o);deco.push(o);
}

let paused=false,errors=true,speed=1,travel=0,last=0;
let screenGlitchNextAt=null,screenGlitchStart=0,screenGlitchDuration=0,screenGlitchStrength=0;
const layer=document.querySelector('#popLayer'),popups=new Set();
const messages=['Unexpected error detected.','Unable to load GFX texture.','Memory access violation.','Rendering process interrupted.','Unknown system exception.','File synchronization failed.','Graphic driver not responding.','Data packet corrupted.','Critical rendering warning.','Cannot read source file.'];
const codes=['0x0000F31A','0x80004005','0x0000007E','0xC0000005','0x0000A2F1'];
const rand=(a,b)=>a+Math.random()*(b-a);
function isGalleryViewOpen(){
 const gallery=document.querySelector('#galleryOverlay');
 const lightbox=document.querySelector('#photoLightbox');
 return !!(gallery?.classList.contains('open')||lightbox?.classList.contains('open'));
}
function renderErrorGlitch(elapsed){
 if(screenGlitchNextAt===null)screenGlitchNextAt=elapsed+rand(.4,2.4);
 if(elapsed>=screenGlitchNextAt){
  screenGlitchStart=elapsed;
  screenGlitchDuration=.42+Math.random()*.35;
  screenGlitchStrength=.48+Math.random()*.14;
  screenGlitchNextAt=elapsed+1.8+Math.random()*1.6;
 }
 const progress=screenGlitchDuration>0?(elapsed-screenGlitchStart)/screenGlitchDuration:-1;
 const width=sceneEl.clientWidth,height=sceneEl.clientHeight;
 glitchContext.clearRect(0,0,width,height);
 if(progress<0||progress>=1){
  glitchOverlay.style.opacity='0';
  sceneEl.style.transform='';
  sceneEl.style.filter='';
  document.querySelector('#galleryOverlay')?.classList.remove('glitch-active');
  document.querySelector('#photoLightbox')?.classList.remove('glitch-active');
  return;
 }

 const strength=Math.sin(progress*Math.PI)*screenGlitchStrength;
 glitchOverlay.style.opacity=String(strength);
 sceneEl.style.transform=`translateX(${rand(-8,8)*strength}px) skewX(${rand(-.75,.75)*strength}deg)`;
 sceneEl.style.filter=`contrast(${1+strength*.42}) saturate(${1+strength*.48}) hue-rotate(${rand(-3.5,3.5)*strength}deg)`;
 const gallery=document.querySelector('#galleryOverlay');
 const lightbox=document.querySelector('#photoLightbox');
 for(const view of [gallery,lightbox]){
  if(!view)continue;
  const active=view.classList.contains('open')&&strength>.04;
  if(active&&!view.classList.contains('glitch-active')){
   view.classList.remove('variant-rgb','variant-block','variant-scan');
   const variants=['variant-rgb','variant-block','variant-scan'];
   view.classList.add(variants[Math.floor(Math.random()*variants.length)]);
  }
  view.classList.toggle('glitch-active',active);
  if(!active)view.classList.remove('variant-rgb','variant-block','variant-scan');
 }
 for(let y=0;y<height;y+=4){
  glitchContext.fillStyle=`rgba(0,2,12,${.13*strength})`;
  glitchContext.fillRect(0,y,width,1);
 }
 const colors=['rgba(34,211,238,.98)','rgba(217,70,239,.96)','rgba(74,222,128,.92)','rgba(255,255,255,.9)'];
 const sliceCount=10+Math.floor(strength*9);
 for(let i=0;i<sliceCount;i++){
  const y=rand(0,height),sliceHeight=rand(4,14)*strength+1;
  glitchContext.fillStyle=`rgba(3,5,16,${rand(.14,.34)*strength})`;
  glitchContext.fillRect(0,y,width,sliceHeight);
  if(Math.random()<.82){
   const x=rand(0,width),sliceWidth=rand(width*.09,width*.58);
   glitchContext.fillStyle=colors[Math.floor(Math.random()*colors.length)];
   glitchContext.fillRect(x,y+rand(-3,3),Math.min(sliceWidth,width-x),rand(1,5)*strength+1);
  }
  if(Math.random()<.24){
   glitchContext.fillStyle=colors[Math.floor(Math.random()*colors.length)];
   glitchContext.fillRect(0,y+rand(-1,1),width,rand(.5,1.5)*strength+.5);
  }
 }
}
function removePopup(p){
 if(!p.isConnected)return;
 clearTimeout(p.timer);p.classList.add('leaving');
 setTimeout(()=>{p.remove();popups.delete(p)},650);
}
function spawnPopup(){
 if(!errors||paused||popups.size>=6)return;
 if(isGalleryViewOpen())return;
 const w=sceneEl.clientWidth,h=sceneEl.clientHeight,width=Math.min(225,w*.35);
 const p=document.createElement('div');p.className='xpwindow';p.style.width=width+'px';
 const side=Math.random();
 let x=side<.35?rand(5,w*.2):side<.7?rand(w*.73,w-width-5):rand(w*.28,w*.65-width);
 p.style.left=Math.max(3,Math.min(w-width-3,x))+'px';p.style.top=rand(65,h-125)+'px';p.style.zIndex=String(10+Math.floor(Math.random()*30));
 p.innerHTML=`<div class="xpbar"><span>⚠ SYSTEM ERROR</span><button class="xpclose" aria-label="Close">×</button></div><div class="xpbody"><span class="warning">⚠️</span><div><b>${messages[Math.floor(Math.random()*messages.length)]}</b><br><span style="color:#555;font-size:9px">Error code: ${codes[Math.floor(Math.random()*codes.length)]}</span></div></div><div class="xpfoot"><button class="xpok">OK</button></div>`;
 layer.appendChild(p);popups.add(p);
 p.querySelector('.xpclose').onclick=()=>removePopup(p);p.querySelector('.xpok').onclick=()=>removePopup(p);
 p.timer=setTimeout(()=>removePopup(p),rand(2600,4400));
}
let popupLoopTimer;
function popupLoop(){if(!document.body.contains(layer))return;if(errors&&!paused&&!isGalleryViewOpen()){spawnPopup();if(Math.random()>.4)setTimeout(spawnPopup,rand(250,500));}popupLoopTimer=setTimeout(popupLoop,rand(850,1400))}
popupLoop();

const galleryOverlay=document.querySelector('#galleryOverlay');
const galleryGrid=document.querySelector('#galleryGrid');
const photoLightbox=document.querySelector('#photoLightbox');
const photoView=document.querySelector('#photoView');
const photoCaption=document.querySelector('#photoCaption');
let galleryBuilt=false,currentPhoto=-1;
function buildGallery(){
 if(galleryBuilt)return;
 gfxFiles.forEach((imagePath,index)=>{
  const card=document.createElement('button');
  card.className='gallery-card';
  card.type='button';
  card.setAttribute('aria-label',`Lihat foto GFX ${String(index+1).padStart(2,'0')}`);
  const image=document.createElement('img');
  image.src=imagePath;
  image.alt=`Foto GFX ${String(index+1).padStart(2,'0')}`;
  image.loading='lazy';
  const label=document.createElement('span');
  label.textContent=`GFX ${String(index+1).padStart(2,'0')}`;
  card.append(image,label);
  card.addEventListener('click',()=>{
   galleryOverlay.classList.remove('open');
   galleryOverlay.setAttribute('aria-hidden','true');
   openPhoto(index);
  });
  galleryGrid.appendChild(card);
 });
 galleryBuilt=true;
}
function openGallery(){
 buildGallery();
 popups.forEach(p=>{clearTimeout(p.timer);p.remove();popups.delete(p)});
 galleryOverlay.classList.add('open');
 galleryOverlay.setAttribute('aria-hidden','false');
 document.querySelector('#closeGallery').focus();
}
function closeGallery(){
 galleryOverlay.classList.remove('open');
 galleryOverlay.classList.remove('glitch-active');
 galleryOverlay.setAttribute('aria-hidden','true');
}
function updatePhoto(index){
 currentPhoto=(index+gfxFiles.length)%gfxFiles.length;
 const label=`GFX ${String(currentPhoto+1).padStart(2,'0')}`;
 photoView.src=gfxFiles[currentPhoto];
 photoView.alt=`Foto ${label}`;
 photoCaption.textContent=`${label} / ${gfxFiles.length}`;
}
function openPhoto(index){
 popups.forEach(p=>{clearTimeout(p.timer);p.remove();popups.delete(p)});
 updatePhoto(index);
 photoLightbox.classList.add('open');
 photoLightbox.setAttribute('aria-hidden','false');
 document.querySelector('#closePhoto').focus();
}
function closePhoto(){
 photoLightbox.classList.remove('open');
 photoLightbox.classList.remove('glitch-active');
 photoLightbox.setAttribute('aria-hidden','true');
 currentPhoto=-1;
 last=0;
 if(!paused)spawnPopup();
}
document.querySelector('#openGallery').addEventListener('click',openGallery);
document.querySelector('#closeGallery').addEventListener('click',closeGallery);
document.querySelector('#closePhoto').addEventListener('click',closePhoto);
document.querySelector('#previousPhoto').addEventListener('click',()=>updatePhoto(currentPhoto-1));
document.querySelector('#nextPhoto').addEventListener('click',()=>updatePhoto(currentPhoto+1));
galleryOverlay.addEventListener('click',event=>{if(event.target===galleryOverlay)closeGallery()});
photoLightbox.addEventListener('click',event=>{if(event.target===photoLightbox)closePhoto()});
window.addEventListener('keydown',event=>{
 if(photoLightbox.classList.contains('open')){
  if(event.key==='Escape')closePhoto();
  else if(event.key==='ArrowLeft')updatePhoto(currentPhoto-1);
  else if(event.key==='ArrowRight')updatePhoto(currentPhoto+1);
 }else if(event.key==='Escape'&&galleryOverlay.classList.contains('open'))closeGallery();
});
const photoRaycaster=new THREE.Raycaster(),photoPointer=new THREE.Vector2();
function findPhotoAtPointer(event){
 const rect=renderer.domElement.getBoundingClientRect();
 if(!rect.width||!rect.height)return null;
 photoPointer.x=((event.clientX-rect.left)/rect.width)*2-1;
 photoPointer.y=-((event.clientY-rect.top)/rect.height)*2+1;
 photoRaycaster.setFromCamera(photoPointer,camera);
 const intersections=photoRaycaster.intersectObjects(photoMeshes,false);
 return intersections.length?intersections[0].object:null;
}
renderer.domElement.addEventListener('pointermove',event=>{
 renderer.domElement.style.cursor=findPhotoAtPointer(event)?'pointer':'';
});
renderer.domElement.addEventListener('pointerleave',()=>{renderer.domElement.style.cursor=''});
renderer.domElement.addEventListener('click',event=>{
 const photo=findPhotoAtPointer(event);
 if(photo)openPhoto(photo.userData.imageIndex);
});

function setErrorsEnabled(enabled){
 if(errors===enabled)return;
 errors=enabled;
 const button=document.querySelector('#errors');
 button.textContent=errors?'ERRORS ON':'ERRORS OFF';
 button.classList.toggle('active',errors);
 if(errors)spawnPopup();
 else popups.forEach(p=>removePopup(p));
}
window.addEventListener('message',event=>{
 if(event.source!==window.parent||!event.data||event.data.type!=='gfx-page-entered')return;
 setErrorsEnabled(true);
});

function resize(){
 const w=host.clientWidth,h=host.clientHeight;
 if(!w||!h)return;
 renderer.setSize(w,h,false);
 const pixelRatio=Math.min(devicePixelRatio,1.5);
 glitchOverlay.width=Math.max(1,Math.floor(w*pixelRatio));
 glitchOverlay.height=Math.max(1,Math.floor(h*pixelRatio));
 glitchContext.setTransform(pixelRatio,0,0,pixelRatio,0,0);
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(host);resize();

function animate(t){
 requestAnimationFrame(animate);
 const dt=last?Math.min((t-last)/1000,.05):0;last=t;
 const elapsed=t/1000;
 if(!paused){
  travel+=dt*speed*7;
  camera.position.z=9-(travel%125);
  camera.position.x=Math.sin(travel*.045)*.12;
  camera.position.y=2.1+Math.sin(travel*.22)*.045;
  camera.lookAt(camera.position.x*.5,2,-20+camera.position.z);
  grid.position.z=-68+(travel%2);ceiling.position.z=-68+(travel%3);
  panels.forEach(p=>{
   let z=p.base-Math.floor(travel/125)*125;
   while(z>camera.position.z+3)z-=125;
   while(z<camera.position.z-130)z+=125;
   p.group.position.z=z;

   const state=p.glitchState;
   if(state.nextAt===null)state.nextAt=elapsed+Math.random()*3.5;
   if(elapsed>=state.nextAt){
    state.start=elapsed;
    state.duration=.18+Math.random()*.16;
    state.strength=.8+Math.random()*.2;
    state.nextAt=elapsed+2.8+Math.random()*4.2;
   }
   const progress=(elapsed-state.start)/state.duration;
   p.glitchMaterial.uniforms.uTime.value=elapsed;
   p.glitchMaterial.uniforms.uGlitch.value=progress>=0&&progress<1
    ?Math.sin(progress*Math.PI)*state.strength
    :0;
  });
  deco.forEach(o=>{let z=o.position.z-Math.floor(travel/125)*125;while(z>camera.position.z+3)z-=125;while(z<camera.position.z-130)z+=125;o.position.z=z;o.rotation.x+=dt*.3*speed;o.rotation.y+=dt*.45*speed});
  purple.intensity=45+Math.sin(t*.0015)*8;
 }
 if(paused){
  glitchContext.clearRect(0,0,sceneEl.clientWidth,sceneEl.clientHeight);
  glitchOverlay.style.opacity='0';
  sceneEl.style.transform='';
  sceneEl.style.filter='';
 }else renderErrorGlitch(elapsed);
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

document.querySelector('#backToWaifu').onclick=()=>{
 if(window.parent!==window)window.parent.location.hash='waifuSection';
 else window.location.href='index.html#waifuSection';
};
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶ PLAY':'Ⅱ PAUSE';e.target.classList.toggle('active',!paused);if(!paused){last=0;spawnPopup()}};
document.querySelector('#errors').onclick=()=>setErrorsEnabled(!errors);
document.querySelector('#speed').oninput=e=>{speed=+e.target.value;document.querySelector('#speedVal').textContent=speed.toFixed(1)+'x'};
</script>
